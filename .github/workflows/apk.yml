name: APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Release-Keystore vorbereiten und pruefen
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 ist nicht gesetzt."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

          KS_PW=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
          KS_ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')
          KS_KEY_PW=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
          echo "ANDROID_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KS_KEY_PW" >> "$GITHUB_ENV"

          echo "Diagnose (Werte werden nicht ausgegeben):"
          echo "- Keystore-Datei: $(stat -c%s "$RUNNER_TEMP/release.keystore") Bytes"
          echo "- Store-Passwort: $([ -n "$KS_PW" ] && echo "gesetzt (Laenge ${#KS_PW})" || echo 'LEER')"
          echo "- Alias: $([ -n "$KS_ALIAS" ] && echo 'gesetzt' || echo 'LEER')"
          echo "- Key-Passwort: $([ -n "$KS_KEY_PW" ] && echo "gesetzt (Laenge ${#KS_KEY_PW})" || echo 'nicht gesetzt, Fallback auf Store-Passwort')"

          if [ -z "$KS_PW" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD oder ANDROID_KEY_ALIAS ist nicht gesetzt."
            exit 1
          fi

          echo "- Store-Oeffnung mit Store-Passwort: "
          if keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PW" > /tmp/kslist.txt 2>/dev/null; then
            echo "  OK"
            ENTRY_COUNT=$(grep -cE ', (PrivateKeyEntry|trustedCertEntry|SecretKeyEntry)' /tmp/kslist.txt || true)
            echo "- Eintraege im Keystore: ${ENTRY_COUNT}"
            if grep -q "^${KS_ALIAS}," /tmp/kslist.txt; then
              echo "- Alias im Keystore: gefunden"
              ENTRY_TYPE=$(grep "^${KS_ALIAS}," /tmp/kslist.txt | head -1)
              echo "- Typ des Alias: $(echo "$ENTRY_TYPE" | sed 's/^[^,]*, [^,]*, //')"
            else
              echo "::error::Alias nicht im Keystore gefunden. Bitte ANDROID_KEY_ALIAS pruefen (lokal: keytool -list -keystore <datei>)."
              exit 1
            fi
          else
            echo "  FEHLGESCHLAGEN"
            echo "::error::Keystore konnte mit dem Store-Passwort nicht geoeffnet werden. Bitte ANDROID_KEYSTORE_PASSWORD pruefen."
            exit 1
          fi

      - name: Version ermitteln
        run: |
          APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::versionName konnte nicht aus app/build.gradle.kts ermittelt werden."
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Version: $APP_VERSION"

      - name: Release-APK bauen
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: FehlerSummary als Annotation
        if: failure()
        run: |
          grep -E "error: |e: |FAILURE|What went wrong|Could not|Caused by|required|keystore|Keystore" build.log | head -12 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-250)"
          done
          exit 1

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk "Einkaufsliste-v${APP_VERSION}.apk"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Einkaufsliste-APK
          path: "Einkaufsliste-v${APP_VERSION}.apk"
          retention-days: 30

      - name: Changelog des aktuellen Releases extrahieren
        run: awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md

      - name: GitHub Release mit Changelog erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION}" "Einkaufsliste-v${APP_VERSION}.apk" \
            --title "Einkaufsliste v${APP_VERSION}" \
            --target main \
            --notes-file release-notes.md \
            2>/dev/null || gh release upload "v${APP_VERSION}" "Einkaufsliste-v${APP_VERSION}.apk" --clobber
