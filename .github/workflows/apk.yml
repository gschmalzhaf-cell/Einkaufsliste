name: APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Release-APK bauen
        run: gradle :app:assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Einkaufsliste-v1.0.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Einkaufsliste-APK
          path: Einkaufsliste-v1.0.apk
          retention-days: 30

      - name: Changelog des aktuellen Releases extrahieren
        run: awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md

      - name: GitHub Release v1.0 mit Changelog erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0 Einkaufsliste-v1.0.apk \
            --title "Einkaufsliste v1.0" \
            --target main \
            --notes-file release-notes.md \
            2>/dev/null || gh release upload v1.0 Einkaufsliste-v1.0.apk --clobber
