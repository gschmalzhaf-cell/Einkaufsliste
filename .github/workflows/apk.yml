name: APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Release-APK bauen
        run: gradle :app:assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Einkaufsliste-v1.0.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Einkaufsliste-APK
          path: Einkaufsliste-v1.0.apk
          retention-days: 30

      - name: GitHub Release v1.0 erstellen/aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0 Einkaufsliste-v1.0.apk \
            --title "Einkaufsliste v1.0" \
            --target main \
            --notes "Erste Version der Einkaufsliste-App.

          Funktionen:
          - Einträge manuell, per Foto (ML Kit Texterkennung, on-device) und aus Rezepttext hinzufügen
          - Material 3 Expressive Design mit dynamischen Farben
          - Lokale Room-Datenbank, kein Account, kein Netzwerkzugriff

          Installation: Einkaufsliste-v1.0.apk herunterladen, aufs Handy übertragen und installieren („Unbekannte Quellen“ erlauben)." \
            2>/dev/null || gh release upload v1.0 Einkaufsliste-v1.0.apk --clobber
