<svg xmlns="http://www.w3.org/2000/svg" width="216" height="216" viewBox="0 0 108 108">
  <!-- App-Icon 'Einkaufsliste 2 – Cozy Seasons' – adaptive Icon, 108dp-Viewport -->
  <!-- Hintergrund-Layer: Warmes Cozy-Papier -->
  <rect width="108" height="108" fill="#FBF3E6"/>
  <circle cx="54" cy="54" r="33" fill="#F3E3C8" opacity="0.65"/>

  <!-- 4 Saison-Partikel rund um die Karte -->
  <path d="M24,33 C24,29.5 27.5,27 31,28.5 C32.5,32 29.5,35.5 26,35 C24.8,34.8 24,34 24,33 Z" fill="#E87A9E"/>
  <circle cx="80" cy="29" r="4.5" fill="#F2A93B"/>
  <path d="M23,74 Q27,69 32,73 Q28,78 23,74 Z" fill="#7FA86B"/>
  <circle cx="81" cy="75" r="3.5" fill="#5B7FB5"/>

  <!-- Weicher Cozy-Kartenschatten -->
  <rect x="26" y="28" width="60" height="60" rx="13" fill="#4E362A" opacity="0.13"/>
  <!-- Weiße Cozy-Karte -->
  <rect x="24" y="25" width="60" height="60" rx="13" fill="#FFFFFF"/>

  <!-- Oberer Saison-Akzent + Tag-Chip -->
  <rect x="33.5" y="33" width="29" height="7" rx="3.5" fill="#C96F2F"/>
  <rect x="61.5" y="33" width="14" height="7" rx="3.5" fill="#FAD8E3"/>

  <!-- Zeile 1: erledigt -->
  <circle cx="39" cy="51" r="6.5" fill="#FBE6D4"/>
  <path d="M36,51.2 l2.2,2.4 l4.3,-4.8" fill="none" stroke="#C96F2F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="48.5" y="48.5" width="26" height="5" rx="2.5" fill="#4E362A"/>

  <!-- Zeile 2: offen -->
  <circle cx="39" cy="66" r="5.5" fill="#E5F4F7" stroke="#2E8FA8" stroke-width="2"/>
  <rect x="48.5" y="62.5" width="22" height="5" rx="2.5" fill="#4E362A"/>
  <rect x="49.2" y="69.5" width="14.6" height="3.6" rx="1.8" fill="#8A6F5C" opacity="0.65"/>

  <!-- Schwebende FAB-Pille unten mittig -->
  <rect x="42" y="79" width="24" height="8" rx="4" fill="#C96F2F"/>
  <path d="M54,81 v4 M52,83 h4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
