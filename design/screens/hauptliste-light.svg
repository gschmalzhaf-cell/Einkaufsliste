<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800">
  <!-- Einkaufsliste – Hauptliste (Light) – Retro Comic Design System v1.12 -->
  <rect width="360" height="800" fill="#FFF6E5"/>
  <!-- App Bar -->
  <rect x="0" y="0" width="360" height="64" fill="#FFF6E5"/>
  <rect x="0" y="62" width="360" height="2" fill="#1D1D1B"/>
  <text x="16" y="42" font-family="Bangers, 'Baloo 2', sans-serif" font-size="30" fill="#D62828">EINKAUFSLISTE</text>
  <!-- Settings-Icon -->
  <circle cx="330" cy="32" r="14" fill="none" stroke="#1D1D1B" stroke-width="2"/>
  <circle cx="330" cy="32" r="5" fill="none" stroke="#1D1D1B" stroke-width="2"/>

  <!-- Tag-Chips -->
  <g>
    <rect x="8" y="76" width="96" height="32" rx="16" fill="#FFF6E5" stroke="#1D1D1B" stroke-width="2"/>
    <text x="34" y="97" font-family="'Baloo 2', sans-serif" font-weight="700" font-size="13" fill="#1D1D1B">Alle</text>
    <rect x="112" y="76" width="104" height="32" rx="16" fill="#FFF6E5" stroke="#1D1D1B" stroke-width="2"/>
    <text x="128" y="97" font-family="'Baloo 2', sans-serif" font-weight="700" font-size="13" fill="#1D1D1B">Ohne Tag</text>
    <rect x="224" y="76" width="112" height="32" rx="16" fill="#FFC800" stroke="#1D1D1B" stroke-width="2"/>
    <text x="240" y="97" font-family="'Baloo 2', sans-serif" font-weight="700" font-size="13" fill="#1D1D1B">Grillabend</text>
  </g>

  <!-- Section-Sticker "Offen" -->
  <rect x="8" y="128" width="100" height="36" rx="6" fill="#FFC800" stroke="#1D1D1B" stroke-width="2"/>
  <text x="26" y="154" font-family="Bangers, 'Baloo 2', sans-serif" font-size="22" fill="#1D1D1B">OFFEN</text>

  <!-- ComicCards -->
  <!-- Karte 1: Milch -->
  <rect x="12" y="180" width="344" height="72" rx="14" fill="#1D1D1B"/>
  <rect x="8" y="176" width="344" height="72" rx="14" fill="#FFFDF5" stroke="#1D1D1B" stroke-width="2"/>
  <rect x="20" y="200" width="22" height="22" rx="4" fill="#FFF6E5" stroke="#1D1D1B" stroke-width="2"/>
  <text x="56" y="212" font-family="'Baloo 2', sans-serif" font-size="16" fill="#1D1D1B">Milch</text>
  <text x="56" y="232" font-family="'Baloo 2', sans-serif" font-size="12" fill="#4A443A">2 Liter</text>
  <circle cx="330" cy="212" r="12" fill="none" stroke="#1D1D1B" stroke-width="2"/>
  <line x1="323" y1="212" x2="337" y2="212" stroke="#1D1D1B" stroke-width="2"/>

  <!-- Karte 2: Steaks -->
  <rect x="12" y="268" width="344" height="72" rx="14" fill="#1D1D1B"/>
  <rect x="8" y="264" width="344" height="72" rx="14" fill="#FFFDF5" stroke="#1D1D1B" stroke-width="2"/>
  <rect x="20" y="288" width="22" height="22" rx="4" fill="#FFF6E5" stroke="#1D1D1B" stroke-width="2"/>
  <text x="56" y="300" font-family="'Baloo 2', sans-serif" font-size="16" fill="#1D1D1B">Steaks</text>
  <text x="120" y="300" font-family="Bangers, 'Baloo 2', sans-serif" font-size="16" fill="#1D6FD1">#Grillabend</text>
  <text x="56" y="320" font-family="'Baloo 2', sans-serif" font-size="12" fill="#4A443A">4 Stück · Handelsüblich: 500 g Packung</text>
  <circle cx="330" cy="300" r="12" fill="none" stroke="#1D1D1B" stroke-width="2"/>
  <line x1="323" y1="300" x2="337" y2="300" stroke="#1D1D1B" stroke-width="2"/>

  <!-- Karte 3: Ketchup -->
  <rect x="12" y="356" width="344" height="72" rx="14" fill="#1D1D1B"/>
  <rect x="8" y="352" width="344" height="72" rx="14" fill="#FFFDF5" stroke="#1D1D1B" stroke-width="2"/>
  <rect x="20" y="376" width="22" height="22" rx="4" fill="#FFF6E5" stroke="#1D1D1B" stroke-width="2"/>
  <text x="56" y="388" font-family="'Baloo 2', sans-serif" font-size="16" fill="#1D1D1B">Ketchup</text>
  <text x="140" y="388" font-family="Bangers, 'Baloo 2', sans-serif" font-size="16" fill="#1D6FD1">#Grillabend</text>
  <text x="56" y="408" font-family="'Baloo 2', sans-serif" font-size="12" fill="#4A443A">1 Flasche</text>
  <circle cx="330" cy="388" r="12" fill="none" stroke="#1D1D1B" stroke-width="2"/>
  <line x1="323" y1="388" x2="337" y2="388" stroke="#1D1D1B" stroke-width="2"/>

  <!-- Karte 4: Brötchen -->
  <rect x="12" y="444" width="344" height="72" rx="14" fill="#1D1D1B"/>
  <rect x="8" y="440" width="344" height="72" rx="14" fill="#FFFDF5" stroke="#1D1D1B" stroke-width="2"/>
  <rect x="20" y="464" width="22" height="22" rx="4" fill="#FFF6E5" stroke="#1D1D1B" stroke-width="2"/>
  <text x="56" y="476" font-family="'Baloo 2', sans-serif" font-size="16" fill="#1D1D1B">Brötchen</text>
  <text x="56" y="496" font-family="'Baloo 2', sans-serif" font-size="12" fill="#4A443A">8 Stück</text>
  <circle cx="330" cy="476" r="12" fill="none" stroke="#1D1D1B" stroke-width="2"/>
  <line x1="323" y1="476" x2="337" y2="476" stroke="#1D1D1B" stroke-width="2"/>

  <!-- FAB -->
  <rect x="196" y="734" width="160" height="48" rx="16" fill="#1D1D1B"/>
  <rect x="192" y="730" width="160" height="48" rx="16" fill="#D62828" stroke="#1D1D1B" stroke-width="2"/>
  <text x="216" y="760" font-family="'Baloo 2', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">+ Hinzufügen</text>
</svg>
